  - name: redis/redis-mcp
    displayName: Redis MCP Server
    provider: Redis
    version: 1.0.0
    documentationUrl: https://redis.io/docs/latest/integrate/redis-mcp/
    repositoryUrl: https://github.com/redis/mcp-redis
    license: MIT
    description: >-
      MCP server enabling AI agents and LLM clients to read, write, and query data in Redis with natural
      language commands. Supports strings, hashes, lists, sets, sorted sets, pub/sub, streams, JSON, and
      vector search. NOTE: stdio-only transport currently - HTTP transport planned for future.
    transports:
      - stdio
    deploymentMode: local
    toolCount: 20
    artifacts:
      - uri: oci://quay.io/mcp-servers/redis-mcp
    tags:
      - database
      - redis
      - caching
      - key-value
      - vector-search
      - pub-sub
      - streams
      - stdio-only
    securityIndicators:
      verifiedSource: true
      secureEndpoint: false
      readOnlyTools: false
    tools:
      - name: string_set
        description: Set string value with optional expiration
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: Redis key
          - name: value
            type: string
            required: true
            description: Value to set
      - name: string_get
        description: Get string value by key
        accessType: read_only
        parameters:
          - name: key
            type: string
            required: true
            description: Redis key
      - name: hash_set
        description: Set hash field-value pairs (supports vector embedding storage)
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: Hash key
      - name: hash_get
        description: Get hash field values
        accessType: read_only
        parameters:
          - name: key
            type: string
            required: true
            description: Hash key
      - name: list_append
        description: Append values to list (queues, activity feeds)
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: List key
      - name: list_pop
        description: Pop values from list
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: List key
      - name: set_add
        description: Add members to set
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: Set key
      - name: set_members
        description: List set members
        accessType: read_only
        parameters:
          - name: key
            type: string
            required: true
            description: Set key
      - name: sorted_set_add
        description: Add members with scores (leaderboards, priority queues)
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: Sorted set key
      - name: sorted_set_range
        description: Get members by score range
        accessType: read_only
        parameters:
          - name: key
            type: string
            required: true
            description: Sorted set key
      - name: publish
        description: Publish message to channel
        accessType: execute
        parameters:
          - name: channel
            type: string
            required: true
            description: Channel name
      - name: stream_add
        description: Add entry to stream (event sourcing)
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: Stream key
      - name: stream_read
        description: Read stream entries with consumer group support
        accessType: read_only
        parameters:
          - name: key
            type: string
            required: true
            description: Stream key
      - name: json_set
        description: Store JSON document with path-based access
        accessType: read_write
        parameters:
          - name: key
            type: string
            required: true
            description: JSON key
      - name: json_get
        description: Get JSON document or path
        accessType: read_only
        parameters:
          - name: key
            type: string
            required: true
            description: JSON key
      - name: docs_search
        description: Natural language queries for Redis documentation
        accessType: read_only
        parameters:
          - name: query
            type: string
            required: true
            description: Search query
      - name: vector_index_create
        description: Create vector index for similarity search
        accessType: read_write
        parameters:
          - name: indexName
            type: string
            required: true
            description: Index name
      - name: vector_search
        description: Perform vector similarity search
        accessType: read_only
        parameters:
          - name: indexName
            type: string
            required: true
            description: Index name
      - name: server_info
        description: Get Redis server information
        accessType: read_only
        parameters: []
      - name: db_info
        description: Get database key count and statistics
        accessType: read_only
        parameters: []
    runtimeMetadata:
      defaultPort: null
      requiredEnvironmentVariables:
        - name: REDIS_HOST
          description: Redis server hostname
          type: config
          required: true
        - name: REDIS_PORT
          description: Redis server port
          type: config
          required: true
      optionalEnvironmentVariables:
        - name: REDIS_PWD
          description: Redis password for authentication
          type: secret
        - name: REDIS_USERNAME
          description: Redis username for authentication
          type: secret
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 128Mi
        recommended:
          cpu: 250m
          memory: 256Mi

