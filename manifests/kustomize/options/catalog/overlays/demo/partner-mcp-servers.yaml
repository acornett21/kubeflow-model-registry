    repositoryUrl: https://github.com/dynatrace-oss/dynatrace-mcp
    license: MIT
    description: >-
      AI Assistants can interact with the Dynatrace observability platform, bringing real-time observability
      data directly into your development workflow. Query logs, events, spans, metrics via DQL.
    transports:
      - stdio
      - http
    deploymentMode: local
    toolCount: 14
