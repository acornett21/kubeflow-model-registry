mcp_servers:
  - name: cyberark/cyberark-sca-mcp-server
    displayName: CyberArk SCA MCP Server
    provider: CyberArk
    logo: data:image/png;base64,
    documentationUrl: https://docs.cyberark.com/sca/latest/en/content/automation/sca-mcp-server.htm
    license: ???
    description: >-
      This topic describes the CyberArk SCA MCP Server, which helps you manage AWS access by allowing AI agents and developers to request and elevate permissions to standalone AWS accounts when needed. It works with SCA and is designed to be used from the command line, IDE, or through an AI assistant.

      When access is granted, the server writes temporary credentials to the AWS credentials file, allowing tools and agents to authenticate without using long-term secrets. This helps reduce security risks by keeping access temporary and on-demand.

      This is useful in workflows like CI/CD, infrastructure as code, and AI-powered development tools.
    transports:
      - http
    deploymentMode: local
    artifacts:
      - uri: oci://quay.io/mcp-servers/cyberark-mcp-server-sca:11-01-2025
    tools:
      - name: login_to_aws_default
        description: Grants temporary, just-in-time access to the default AWS account and role configured on the server.
        accessType: read_only
        parameters: []
      - name: elevate_aws_account_access
        description: Grants temporary, just-in-time access to a specified AWS account using a designated role.
        accessType: read_only
        parameters: []
    securityIndicators:
      verifiedSource: false
      sast: true
      secureEndpoint: true
      readOnlyTools: false

  - name: aliyun/alibaba-cloud-ops-mcp-server
    displayName: Alibaba Cloud OPS MCP Server
    provider: Alibaba Cloud (Aliyun)
    version: 0.9.1
    documentationUrl: https://github.com/aliyun/alibaba-cloud-ops-mcp-server/blob/main/README.md
    repositoryUrl: https://github.com/aliyun/alibaba-cloud-ops-mcp-server
    license: Apache-2.0
    description: >-
      Model Context Protocol (MCP) server that provides seamless integration with Alibaba Cloud APIs,
      enabling AI assistants to operate resources on Alibaba Cloud. Supports ECS, Cloud Monitor, OOS,
      OSS, VPC, RDS and other widely used cloud products.
    transports:
      - stdio
      - sse
      - streamable-http
    deploymentMode: local
    toolCount: 38
    artifacts:
      - uri: oci://quay.io/mcp-servers/alibaba-cloud-ops-mcp-server:09-30-2025@sha256:a4c21de6961e78d378a01ac3b89d7355b39c024edbbefac5b4b4a9d1961e5b44
    tags:
      - cloud-management
      - alibaba-cloud
      - infrastructure
      - ecs
      - rds
      - oss
      - vpc
      - monitoring
    securityIndicators:
      verifiedSource: true
      secureEndpoint: false
      sast: false
      readOnlyTools: false
    tools:
      - name: RunCommand
        description: Execute commands on ECS instances
        accessType: execute
        parameters:
          - name: instanceId
            type: string
            required: true
            description: The ID of the ECS instance
          - name: command
            type: string
            required: true
            description: The command to execute
      - name: DescribeInstances
        description: Query ECS instance information
        accessType: read_only
        parameters:
          - name: regionId
            type: string
            required: false
            description: The region ID
      - name: StartInstances
        description: Start one or more ECS instances
        accessType: read_write
        parameters:
          - name: instanceIds
            type: array
            required: true
            description: List of instance IDs to start
      - name: StopInstances
        description: Stop one or more ECS instances
        accessType: read_write
        parameters:
          - name: instanceIds
            type: array
            required: true
            description: List of instance IDs to stop
      - name: GetCpuUsageData
        description: Get CPU usage monitoring data
        accessType: read_only
        parameters:
          - name: instanceId
            type: string
            required: true
            description: The instance ID
      - name: GetMemUsageData
        description: Get memory usage monitoring data
        accessType: read_only
        parameters:
          - name: instanceId
            type: string
            required: true
            description: The instance ID
      - name: ListBuckets
        description: List all OSS buckets
        accessType: read_only
        parameters: []
      - name: DescribeDBInstances
        description: Query RDS database instance information
        accessType: read_only
        parameters:
          - name: regionId
            type: string
            required: false
            description: The region ID
    runtimeMetadata:
      defaultPort: 8080
      defaultArgs: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8080"]
      requiredEnvironmentVariables:
        - name: ALIBABA_CLOUD_ACCESS_KEY_ID
          description: Alibaba Cloud Access Key ID for API authentication
          type: secret
          required: true
        - name: ALIBABA_CLOUD_ACCESS_KEY_SECRET
          description: Alibaba Cloud Access Key Secret for API authentication
          type: secret
          required: true
      optionalEnvironmentVariables:
        - name: ALIBABA_CLOUD_REGION
          description: Default Alibaba Cloud region for operations
          defaultValue: cn-hangzhou
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 128Mi
        recommended:
          cpu: 250m
          memory: 256Mi

  - name: dynatrace-oss/dynatrace-mcp
    displayName: Dynatrace MCP Server
    provider: Dynatrace
    version: 1.4.0
