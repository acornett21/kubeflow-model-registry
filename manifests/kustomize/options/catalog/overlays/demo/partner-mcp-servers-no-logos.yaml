mcp_servers:
  - name: cloudera/iceberg-mcp-server
    displayName: Cloudera Iceberg MCP Server
    provider: Cloudera
    version: 1.0.0
    documentationUrl: https://github.com/cloudera/iceberg-mcp-server
    repositoryUrl: https://github.com/cloudera/iceberg-mcp-server
    license: Unknown
    description: >-
      Enable AI on the open data lakehouse. Provides MCP interface for querying Apache Iceberg tables via Impala. Read-only SQL queries with schema discovery capabilities.
    transports:
      - stdio
      - http
      - sse
    deploymentMode: local
    toolCount: 2
    artifacts:
      - uri: oci://quay.io/mcp-servers/iceberg-mcp-server:10-2-2025@sha256:f7253cd2801a3c17c6cd3d0114d456d15142d0efb1139beb9c793e5fd393e055
    tags:
      - iceberg
      - impala
      - cloudera
      - data-lakehouse
      - sql
      - query
      - analytics
      - read-only-queries
    securityIndicators:
      verifiedSource: true
      secureEndpoint: true
      readOnlyTools: true
    tools:
      - name: execute_query
        description: >-
          Executes SQL queries on Impala and returns results as JSON format
        accessType: execute
        parameters:
          - name: query
            type: string
            required: true
            description: >-
              SQL query to execute on Impala (read-only SELECT operations)
      - name: get_schema
        description: >-
          Retrieves a list of all available tables in the current database
        accessType: read_only
        parameters: [ ]
    runtimeMetadata:
      defaultPort: 8080
      requiredEnvironmentVariables:
        - name: IMPALA_HOST
          description: >-
            Hostname of the Impala coordinator
          type: config
          required: true
        - name: IMPALA_PORT
          description: >-
            Port number for Impala connection
          type: config
          required: true
        - name: IMPALA_USER
          description: >-
            Username for Impala authentication
          type: secret
          required: true
        - name: IMPALA_PASSWORD
          description: >-
            Password for Impala authentication
          type: secret
          required: true
        - name: IMPALA_DATABASE
          description: >-
            Target database name in Impala
          type: config
          required: true
        - name: MCP_TRANSPORT
          description: >-
            Transport protocol mode (http, sse, stdio)
          type: config
          required: true
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 256Mi
        recommended:
          cpu: 500m
          memory: 512Mi
  - name: confluentinc/mcp-confluent
    displayName: Confluent Kafka MCP Server
    provider: Confluent
    version: 1.0.0
    documentationUrl: https://github.com/confluentinc/mcp-confluent
    repositoryUrl: https://github.com/confluentinc/mcp-confluent
    license: Unknown
    description: >-
      Interact with Confluent Kafka and Confluent Cloud REST APIs. Enables AI assistants to manage Kafka topics, connectors, 
      Flink SQL statements, Schema Registry, and Tableflow resources through natural language.
    transports:
      - stdio
      - http
      - sse
    deploymentMode: local
    toolCount: 46
    artifacts:
      - uri: oci://quay.io/mcp-servers/mcp-confluent:10-2-2025@sha256:314b69a43629a68c5075e33b05949f6c2d21eaa0534aa8e169c98940fa86aba4
    tags:
      - kafka
      - confluent
      - streaming
      - flink
      - schema-registry
      - connectors
    securityIndicators:
      verifiedSource: true
      secureEndpoint: true
      readOnlyTools: false
    tools:
      - name: list-topics
        description: >-
          Enumerate all topics in the Kafka cluster
        accessType: read_only
        parameters: [ ]
      - name: create-topics
        description: >-
          Provision one or more Kafka topics
        accessType: read_write
        parameters:
          - name: topics
            type: array
            required: true
            description: >-
              Topic names and configurations to create
      - name: produce-message
        description: >-
          Produce records to a Kafka topic with Schema Registry serialization
        accessType: read_write
        parameters:
          - name: topic
            type: string
            required: true
            description: >-
              Target topic name
      - name: consume-messages
        description: >-
          Consume messages from Kafka topics with automatic deserialization
        accessType: read_only
        parameters:
          - name: topics
            type: array
            required: true
            description: >-
              Topic names to consume from
      - name: create-flink-statement
        description: >-
          Create and execute a Flink SQL statement
        accessType: execute
        parameters:
          - name: sql
            type: string
            required: true
            description: >-
              SQL query text
    runtimeMetadata:
      defaultPort: 8080
      requiredEnvironmentVariables:
        - name: CONFLUENT_CLOUD_API_KEY
          description: >-
            Master API key for Confluent Cloud
          type: secret
          required: true
        - name: CONFLUENT_CLOUD_API_SECRET
          description: >-
            Master API secret for Confluent Cloud
          type: secret
          required: true
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 256Mi
        recommended:
          cpu: 500m
          memory: 512Mi
  - name: dynatrace-oss/dynatrace-mcp
    displayName: Dynatrace MCP Server
    provider: Dynatrace
    version: 1.4.0
    documentationUrl: https://www.dynatrace.com/hub/detail/dynatrace-mcp-server/
    repositoryUrl: https://github.com/dynatrace-oss/dynatrace-mcp
    license: MIT
    description: >-
      AI Assistants can interact with the Dynatrace observability platform, bringing real-time observability data directly 
      into your development workflow. Query logs, events, spans, metrics via DQL.
    transports:
      - stdio
      - http
    deploymentMode: local
    toolCount: 14
    artifacts:
      - uri: oci://quay.io/mcp-servers/dynatrace-mcp:10-01-2025@sha256:f72c1d456fe9101d2742c17f6000a56e53976e45fb401ed817f38ef49056e1a9
    tags:
      - dynatrace
      - observability
      - monitoring
      - apm
      - dql
      - logs
      - metrics
      - traces
    securityIndicators:
      verifiedSource: true
      secureEndpoint: true
      readOnlyTools: false
    tools:
      - name: execute_dql
        description: >-
          Query Dynatrace using natural language or DQL (Dynatrace Query Language) statements; retrieves logs, events, spans, and metrics
        accessType: read_only
        parameters:
          - name: query
            type: string
            required: true
            description: >-
              DQL query or natural language description of data to retrieve
      - name: list_problems
        description: >-
          Identify service issues from monitored infrastructure
        accessType: read_only
        parameters:
          - name: timeframe
            type: string
            required: false
            description: >-
              Time range for problem search
          - name: status
            type: string
            required: false
            description: >-
              Filter by problem status
      - name: get_problem_details
        description: >-
          Deep-dive into specific problems with full context
        accessType: read_only
        parameters:
          - name: problem_id
            type: string
            required: true
            description: >-
              ID of the problem to investigate
      - name: list_security_problems
        description: >-
          Track vulnerabilities and security events
        accessType: read_only
        parameters: [ ]
      - name: get_entity_details
        description: >-
          Retrieve comprehensive information about monitored services, hosts, and applications
        accessType: read_only
        parameters:
          - name: entity_id
            type: string
            required: true
            description: >-
              ID of the entity to inspect
      - name: send_event
        description: >-
          Transmit custom event data to Dynatrace for ingestion
        accessType: execute
        parameters:
          - name: event
            type: object
            required: true
            description: >-
              Event data to send to Dynatrace
      - name: list_documents
        description: >-
          Retrieve Notebooks, Dashboards, and Launchpads from Dynatrace
        accessType: read_only
        parameters: [ ]
      - name: create_document
        description: >-
          Generate new documents in Dynatrace
        accessType: read_write
        parameters:
          - name: content
            type: object
            required: true
            description: >-
              Document content to create
    runtimeMetadata:
      defaultPort: 8585
      defaultArgs:
        - --http
        - --port
        - '8585'
        - --host
        - 0.0.0.0
      requiredEnvironmentVariables:
        - name: DT_ENVIRONMENT
          description: >-
            Dynatrace Platform URL
          type: config
          required: true
        - name: DT_PLATFORM_TOKEN
          description: >-
            Dynatrace Platform API token
          type: secret
          required: false
        - name: OAUTH_CLIENT_ID
          description: >-
            OAuth client ID for Dynatrace authentication
          type: secret
          required: false
        - name: OAUTH_CLIENT_SECRET
          description: >-
            OAuth client secret for Dynatrace authentication
          type: secret
          required: false
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 128Mi
        recommended:
          cpu: 250m
          memory: 256Mi
