  - name: mariadb/mcp
    displayName: MCP MariaDB Server
    provider: MariaDB
    version: 1.0.0
    documentationUrl: https://github.com/mariadb/mcp
    repositoryUrl: https://github.com/mariadb/mcp
    license: MIT
    description: >-
      A standard interface for managing and querying MariaDB databases. Supports SQL operations, schema inspection, and optional
      vector/embedding-based semantic search. Includes comprehensive vector search capabilities with support for OpenAI, Gemini, and Hugging Face embeddings.
    transports:
      - stdio
      - http
      - sse
    deploymentMode: local
    toolCount: 11
    artifacts:
      - uri: oci://quay.io/mcp-servers/mariadb-mcp:10-3-2025@sha256:95c179d08dad661bfb8fc0f6959976f9ad3f90d70a8ccb831978958e58bca73e
    tags:
      - mariadb
      - mysql
      - database
      - sql
      - vector-search
      - embeddings
      - semantic-search
    securityIndicators:
      verifiedSource: true
      secureEndpoint: true
      readOnlyTools: false
    tools:
      - name: list_databases
        description: >-
          Enumerate all accessible databases on the MariaDB server
        accessType: read_only
        parameters: [ ]
      - name: list_tables
        description: >-
          Show all tables in a specified database
        accessType: read_only
        parameters:
          - name: database
            type: string
            required: true
            description: >-
              Database name to list tables from
      - name: get_table_schema
        description: >-
          Retrieve column definitions, types, and keys for a table
        accessType: read_only
        parameters:
          - name: table
            type: string
            required: true
            description: >-
              Table name to get schema for
      - name: get_table_schema_with_relations
        description: >-
          Retrieve table schema including foreign key relationships
        accessType: read_only
        parameters:
          - name: table
            type: string
            required: true
            description: >-
              Table name to get schema with relations for
      - name: execute_sql
        description: >-
          Run SQL queries (read-only mode by default, controlled by MCP_READ_ONLY env var)
        accessType: read_write
        parameters:
          - name: query
            type: string
            required: true
            description: >-
              SQL query to execute
      - name: create_database
        description: >-
          Create a new database on the MariaDB server
        accessType: read_write
        parameters:
          - name: name
            type: string
            required: true
            description: >-
              Name of the database to create
      - name: create_vector_store
        description: >-
          Initialize embedding storage with configurable distance functions
        accessType: read_write
        parameters:
          - name: name
            type: string
            required: true
            description: >-
              Name for the vector store
      - name: delete_vector_store
        description: >-
          Remove a vector store table
        accessType: read_write
        parameters:
          - name: name
            type: string
            required: true
            description: >-
              Name of the vector store to delete
      - name: list_vector_stores
        description: >-
          Display all available vector stores
        accessType: read_only
        parameters: [ ]
      - name: insert_docs_vector_store
        description: >-
          Batch insert documents with optional metadata into a vector store
        accessType: read_write
        parameters:
          - name: store_name
            type: string
            required: true
            description: >-
              Target vector store name
          - name: documents
            type: array
            required: true
            description: >-
              Documents to insert with optional metadata
      - name: search_vector_store
        description: >-
          Perform semantic similarity search across vector store documents
        accessType: read_only
        parameters:
          - name: store_name
            type: string
            required: true
            description: >-
              Vector store to search
          - name: query
            type: string
            required: true
            description: >-
              Search query text
    runtimeMetadata:
      defaultPort: 9001
      requiredEnvironmentVariables:
        - name: DB_HOST
          description: >-
            MariaDB server hostname
          type: config
          required: true
        - name: DB_USER
          description: >-
            MariaDB username
          type: secret
          required: true
        - name: DB_PASSWORD
          description: >-
            MariaDB password
          type: secret
          required: true
      optionalEnvironmentVariables:
        - name: DB_PORT
          description: >-
            MariaDB server port
          type: config
          default: '3306'
        - name: MCP_READ_ONLY
          description: >-
            Enforce read-only mode for SQL queries
          type: config
          default: 'true'
        - name: EMBEDDING_PROVIDER
          description: >-
            Embedding provider for vector operations (openai, gemini, huggingface)
          type: config
      recommendedResources:
        minimal:
          cpu: 250m
          memory: 512Mi
        recommended:
          cpu: 500m
          memory: 1Gi
