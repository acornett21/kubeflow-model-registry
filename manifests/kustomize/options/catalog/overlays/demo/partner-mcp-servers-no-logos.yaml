  - name: cyberark/cyberark-sca-mcp-server
    displayName: CyberArk SCA MCP Server
    provider: CyberArk
    documentationUrl: https://docs.cyberark.com/sca/latest/en/content/automation/sca-mcp-server.htm
    license: ???
    description: >-
      This topic describes the CyberArk SCA MCP Server, which helps you manage AWS access by allowing AI agents and developers to request and elevate
      permissions to standalone AWS accounts when needed. It works with SCA and is designed to be used from the command line, IDE, or through an AI assistant.
      
      When access is granted, the server writes temporary credentials to the AWS credentials file, allowing tools and agents to authenticate without 
      using long-term secrets. This helps reduce security risks by keeping access temporary and on-demand.
      
      This is useful in workflows like CI/CD, infrastructure as code, and AI-powered development tools.
    transports:
