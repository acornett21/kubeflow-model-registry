      - name: login_to_aws_default
        description: >-
          Grants temporary, just-in-time access to the default AWS account and role configured on the server.
        accessType: read_only
        parameters: [ ]
      - name: elevate_aws_account_access
        description: >-
          Grants temporary, just-in-time access to a specified AWS account using a designated role.
        accessType: read_only
        parameters: [ ]
    securityIndicators:
      verifiedSource: false
      sast: true
      secureEndpoint: true
      readOnlyTools: false
  - name: oracle/oci-cloud-mcp-server
    displayName: Oracle OCI Cloud MCP Server
    provider: Oracle
    version: 1.0.0
    documentationUrl: https://github.com/oracle/mcp/blob/main/src/oci-cloud-mcp-server/README.md
    repositoryUrl: https://github.com/oracle/mcp/tree/main/src/oci-cloud-mcp-server
    license: Universal Permissive License v1.0
    description: >-
      Interact with Oracle Cloud Infrastructure (OCI) services using the official OCI Python SDK directly. Supports comprehensive OCI service access including Compute, VirtualNetwork, Identity, and more through native SDK operations.
    transports:
      - stdio
      - http
    deploymentMode: remote
    toolCount: 2
    artifacts:
      - uri: oci://quay.io/mcp-servers/oracle/oci-cloud-mcp-server:2026-03-17@sha256:8995e6ce6bb0fc98dbe28fdbeac007ef7280345de96dd297e0311b4e252e0284
    tags:
      - cloud-provider
      - oracle
      - oci
      - infrastructure
      - compute
      - networking
      - identity
      - sdk
    securityIndicators:
      verifiedSource: true
      secureEndpoint: true
      sast: false
      readOnlyTools: false
    tools:
      - name: invoke_oci_api
        description: >-
          Execute OCI Python SDK operations programmatically. Supports any OCI service accessible via the Python SDK with automatic pagination for list operations.
        accessType: execute
        parameters:
          - name: client_fqn
            type: string
            required: true
            description: >-
              Fully-qualified client class name (e.g., oci.core.ComputeClient)
          - name: operation
            type: string
            required: true
            description: >-
              SDK method name in snake_case (e.g., list_instances, launch_instance)
          - name: params
            type: object
            required: true
            description: >-
              JSON object containing keyword arguments matching SDK method signatures. Parameters ending with _details, _config, etc. are auto-converted to OCI model objects.
      - name: list_client_operations
        description: >-
          Discover available operations for OCI client classes with docstring-extracted summaries.
        accessType: read_only
        parameters:
          - name: client_fqn
            type: string
            required: true
            description: >-
              Fully-qualified client class name to inspect
    runtimeMetadata:
      defaultPort: 8080
      defaultArgs: [ ]
      requiredEnvironmentVariables:
        - name: OCI_CONFIG_FILE_CONTENT
          description: >-
            Base64-encoded OCI configuration file content (~/.oci/config). Contains API key credentials and tenancy information.
          type: secret
          required: true
        - name: OCI_KEY_FILE_CONTENT
          description: >-
            Base64-encoded OCI API private key file content. Required for API key signer authentication.
          type: secret
          required: true
        - name: ORACLE_MCP_HOST
          description: >-
            Hostname or IP address for HTTP transport mode (e.g., 0.0.0.0 for all interfaces)
          type: config
          required: true
        - name: ORACLE_MCP_PORT
          description: >-
            Port number for HTTP transport mode (e.g., 8080)
          type: config
          required: true
      optionalEnvironmentVariables:
        - name: OCI_CONFIG_PROFILE
          description: >-
            Alternate OCI configuration profile name (default is DEFAULT profile)
          type: config
          required: false
        - name: OCI_SECURITY_TOKEN_FILE_CONTENT
          description: >-
            Base64-encoded security token file content. If provided, uses Security Token Signer instead of API key signer.
          type: secret
          required: false
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 128Mi
        recommended:
          cpu: 250m
          memory: 256Mi
  - name: enterprisedb/pg-airman-mcp
    displayName: PG Airman MCP
    provider: EnterpriseDB
    version: 1.0.0
    documentationUrl: https://github.com/EnterpriseDB/pg-airman-mcp
    repositoryUrl: https://github.com/EnterpriseDB/pg-airman-mcp
    license: Apache-2.0
    description: >-
      Open-source Model Context Protocol server supporting AI agents throughout the complete PostgreSQL database development lifecycle—from initial coding through testing, deployment, and production tuning and maintenance. Provides comprehensive database health analysis, industrial-strength index tuning algorithms, query optimization, schema intelligence, and safe SQL execution with configurable access control.
    transports:
      - stdio
      - sse
      - http
    deploymentMode: remote
    toolCount: 10
    artifacts:
      - uri: docker.io/enterprisedb/pg-airman-mcp:1.0.0@sha256:7369df0b52c020bde202c739f913e4fae879c700488aece97b04fff5675d3442
    tags:
      - database
      - postgresql
      - sql
      - query-optimization
      - index-tuning
      - database-health
      - schema-intelligence
      - performance
      - dba
    securityIndicators:
      verifiedSource: true
      secureEndpoint: true
      sast: false
      readOnlyTools: false
    tools:
      - name: list_schemas
        description: >-
          Lists all database schemas available in the PostgreSQL instance
        accessType: read_only
        parameters: []
      - name: list_objects
        description: >-
          Lists database objects (tables, views, sequences, extensions) within a specified schema
        accessType: read_only
        parameters:
          - name: schema
            type: string
            required: true
            description: >-
              Schema name to list objects from
      - name: get_object_details
        description: >-
          Provides information about a specific database object, including columns, constraints, and indexes
        accessType: read_only
        parameters:
          - name: object
            type: string
            required: true
            description: >-
              Fully qualified object identifier
      - name: execute_sql
        description: >-
          Executes SQL statements on the database with read-only limitations in restricted mode
        accessType: read_write
        parameters:
          - name: sql
            type: string
            required: true
            description: >-
              SQL statement to execute
      - name: explain_query
        description: >-
          Gets the execution plan for a SQL query describing how PostgreSQL will process it
        accessType: read_only
        parameters:
          - name: query
            type: string
            required: true
            description: >-
              SQL query to explain
          - name: hypothetical_indexes
            type: array
            required: false
            description: >-
              Optional list of hypothetical indexes to test
      - name: get_top_queries
        description: >-
          Reports the slowest SQL queries based on total execution time using pg_stat_statements data
        accessType: read_only
        parameters:
          - name: metric
            type: string
            required: false
            description: >-
              Execution time metric for ranking
      - name: analyze_workload_indexes
        description: >-
          Analyzes the database workload to identify resource-intensive queries and recommends optimal indexes
        accessType: read_only
        parameters:
          - name: workload_params
            type: object
            required: false
            description: >-
              Workload analysis parameters
      - name: analyze_query_indexes
        description: >-
          Analyzes a list of specific SQL queries (up to 10) and recommends optimal indexes
        accessType: read_only
        parameters:
          - name: queries
            type: array
            required: true
            description: >-
              List of SQL queries (max 10) to analyze
      - name: analyze_db_health
        description: >-
          Performs comprehensive health checks including buffer cache hit rates, connection health, constraint validation, index health, sequence limits, and vacuum health
        accessType: read_only
        parameters:
          - name: health_params
            type: object
            required: false
            description: >-
              Health check parameters
      - name: add_comment_to_object
        description: >-
          Adds a comment to a table, view, or column (allowed in restricted mode if ALLOW_COMMENT_IN_RESTRICTED=true)
        accessType: read_write
        parameters:
          - name: object_type
            type: string
            required: true
            description: >-
              Type of object (table, view, column)
          - name: object_identifier
            type: string
            required: true
            description: >-
              Fully qualified object identifier
          - name: comment
            type: string
            required: true
            description: >-
              Comment text to add
    runtimeMetadata:
      defaultPort: 8000
      defaultArgs:
        - --transport=sse
        - --access-mode=restricted
      requiredEnvironmentVariables:
        - name: AIRMAN_MCP_DATABASE_URL
          description: >-
            PostgreSQL connection string (postgresql://user:pass@host:port/db)
          type: secret
          required: true
      optionalEnvironmentVariables:
        - name: AIRMAN_MCP_AUTH_ENABLED
          description: >-
            Enable OAuth 2.0 authentication (true/false)
          type: config
          default: 'false'
        - name: AIRMAN_MCP_AUTH_SERVER_URL
          description: >-
            OAuth authorization server endpoint for token introspection
          type: config
        - name: AIRMAN_MCP_AUTH_REQUIRED_SCOPES
          description: >-
            Required OAuth scopes for access
          type: config
          default: 'mcp:postgres:access'
        - name: AIRMAN_MCP_DNS_REBINDING_PROTECTION
          description: >-
            Enable DNS rebinding protection for reverse proxy deployments
          type: config
          default: 'false'
        - name: AIRMAN_MCP_ALLOWED_HOSTS
          description: >-
            Comma-separated list of allowed Host header values
          type: config
        - name: AIRMAN_MCP_ALLOWED_ORIGINS
          description: >-
            Comma-separated list of allowed Origin header values
          type: config
        - name: ALLOW_COMMENT_IN_RESTRICTED
          description: >-
            Allow COMMENT ON statements in restricted mode
          type: config
          default: 'true'
      recommendedResources:
        minimal:
          cpu: 100m
          memory: 256Mi
        recommended:
          cpu: 250m
          memory: 512Mi
